[functions.ratings-dashboard]
# The handler validates every bearer token with Supabase Auth getUser().
# This supports modern signing keys without the legacy gateway JWT verifier.
verify_jwt = false

[functions.submit-rating]
# Account-free endpoint: handler validation and the existing anonymous ratings RLS apply.
verify_jwt = false

[functions.submit-enquiry]
# Anonymous submission; validation is enforced by the handler.
verify_jwt = false
