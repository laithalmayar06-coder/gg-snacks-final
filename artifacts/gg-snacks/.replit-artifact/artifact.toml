kind = "web"
previewPath = "/"
title = "GG Snacks"
description = "A premium animated brand website foundation for GG Snacks, a Saudi snack company from Jeddah with a bold gaming-inspired identity, structured product data, responsive navigation, and rating route shells."
version = "1.0.0"
id = "artifacts/gg-snacks"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19242

[services.development]
run = "pnpm --filter @workspace/gg-snacks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gg-snacks", "run", "build" ]
serve = "static"
publicDir = "artifacts/gg-snacks/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19242"
BASE_PATH = "/"
